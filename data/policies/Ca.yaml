# California-style MOCK policy pack. Illustrative values only, not legal advice.
# Clause IDs are {JURISDICTION}-{TOPIC}-{NN}. Rule classes look clauses up by
# the suffix (e.g. OT-DAILY-01) so every pack works without code changes.
jurisdiction: CA
version: "2026.1"
disclaimer: Illustrative mock values, not legal advice.
clauses:
  - id: CA-MISS-01
    title: Missed punch correction
    text: >
      A missing clock-in or clock-out may be corrected by adding a punch no
      more than the allowed window away from the scheduled shift boundary,
      and only after the employee confirms the time.
    params:
      max_punch_add_window_minutes: 30
  - id: CA-OT-DAILY-01
    title: Daily overtime
    text: >
      Hours worked beyond 8 in a workday are overtime and require manager
      approval. A workday may not exceed 12 hours.
    params:
      daily_ot_after_hours: 8
      max_daily_hours: 12
  - id: CA-OT-WEEKLY-01
    title: Weekly overtime
    text: >
      Hours worked beyond 40 in a workweek are overtime and require manager
      approval.
    params:
      weekly_ot_after_hours: 40
  - id: CA-MEAL-01
    title: Meal break
    text: >
      An unpaid meal break of at least 30 minutes is required when a shift
      is longer than 5 hours.
    params:
      meal_required_after_hours: 5
      min_meal_minutes: 30
  - id: CA-REST-01
    title: Rest between shifts
    text: >
      At least 8 hours of rest are required between the end of one shift and
      the start of the next.
    params:
      min_rest_hours_between_shifts: 8
  - id: CA-LEAVE-01
    title: Leave conflicts
    text: >
      Hours may not be recorded as worked during approved leave. Conflicts
      are escalated for review.
    params: {}