services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timeguard-api
    ports:
      - "8000:8000"
    environment:
      - LLM_MODE=demo
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    volumes:
      - timeguard-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: timeguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  timeguard-data:
